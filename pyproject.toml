[project]
name = "projet-nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matthieu Baucher", email = "ttbaucher@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "missingno>=0.5.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "seaborn>=0.13.2",
    "yfinance>=1.7.0",
]

[project.scripts]
projet-nlp = "projet_nlp:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
